<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#grad)" stroke="#F59E0B" stroke-width="14" filter="url(#shadow)"/>
  <!-- Owl Face Circle -->
  <circle cx="256" cy="270" r="150" fill="#78350F"/>
  <!-- Belly -->
  <ellipse cx="256" cy="320" rx="95" ry="90" fill="#FEF3C7"/>
  <!-- Eyes -->
  <circle cx="205" cy="235" r="48" fill="#FFFFFF"/>
  <circle cx="307" cy="235" r="48" fill="#FFFFFF"/>
  <circle cx="205" cy="235" r="24" fill="#1E293B"/>
  <circle cx="307" cy="235" r="24" fill="#1E293B"/>
  <circle cx="196" cy="225" r="8" fill="#FFFFFF"/>
  <circle cx="298" cy="225" r="8" fill="#FFFFFF"/>
  <!-- Beak -->
  <polygon points="256,260 240,290 272,290" fill="#F59E0B"/>
  <!-- Ears / Horns -->
  <polygon points="150,150 190,210 130,210" fill="#78350F"/>
  <polygon points="362,150 382,210 322,210" fill="#78350F"/>
  <!-- Star Badge -->
  <polygon points="256,70 270,105 308,107 278,130 288,166 256,145 224,166 234,130 204,107 242,105" fill="#FBBF24" stroke="#D97706" stroke-width="4"/>
</svg>
